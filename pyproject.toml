[project]
name = "workspace-data-server"
version = "1.2.0"
description = "Virtualize a directory and store data."
authors = [
    {name = "Qeggs",email = "get_boot@outlook.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.143.2,<0.144.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "pydantic (>=2.14.1,<3.0.0)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "cachetools (>=7.2.1,<8.0.0)",
    "typing-extensions (>=4.16.0,<5.0.0)",
    "orjson (>=3.13.0,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false